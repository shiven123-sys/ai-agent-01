<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic AI Assistant</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #6366f1; --user-bubble: #6366f1; --bot-bubble: #334155;
    --tool-bubble: #0e7490;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    align-items: center; min-height: 100vh; padding: 20px;
  }
  .app { width: 100%; max-width: 680px; display: flex; flex-direction: column; height: 90vh; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  #resetBtn { background: transparent; border: 1px solid #334155; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  #resetBtn:hover { border-color: var(--accent); color: var(--text); }
  #chat {
    flex: 1; background: var(--card); border-radius: 14px; padding: 16px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .tool { align-self: flex-start; background: var(--tool-bubble); color: #cffafe; font-size: 12px; font-family: monospace; opacity: 0.9; border-radius: 8px; padding: 6px 10px; }
  .error { align-self: center; color: #fca5a5; font-size: 13px; text-align: center; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input {
    flex: 1; background: var(--card); border: 1px solid #334155; border-radius: 10px;
    color: var(--text); padding: 12px 14px; font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); }
  button[type="submit"] {
    background: var(--accent); color: white; border: none; padding: 0 20px;
    border-radius: 10px; font-weight: 600; cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🤖 Agentic AI Assistant</h1>
      <p>calculator · weather · wikipedia · notes · unit converter</p>
    </div>
    <button id="resetBtn" onclick="resetChat()">Reset</button>
  </header>
  <div id="chat"></div>
  <form id="form" onsubmit="sendMessage(event)">
    <input id="input" type="text" placeholder="Ask me anything..." autocomplete="off" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addToolTrace(call) {
  const div = document.createElement('div');
  div.className = 'tool';
  div.textContent = `🔧 ${call.name}(${JSON.stringify(call.arguments)})`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(e) {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  input.value = '';
  sendBtn.disabled = true;

  const typing = addMessage('Assistant is thinking...', 'typing');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    const data = await res.json();
    typing.remove();

    if (!res.ok) {
      addMessage(data.error || 'Something went wrong.', 'error');
      return;
    }

    (data.tool_calls || []).forEach(addToolTrace);
    addMessage(data.reply, 'bot');
  } catch (err) {
    typing.remove();
    addMessage('Could not reach the server. Is the Flask app running?', 'error');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

async function resetChat() {
  await fetch('/reset', { method: 'POST' });
  chat.innerHTML = '';
  addMessage('Conversation memory cleared.', 'typing');
}

window.onload = () => {
  fetch('/health').then(r => r.json()).then(d => {
    if (!d.configured) {
      addMessage(`No API key configured for provider "${d.provider}". Check the README for setup steps.`, 'error');
    }
  });
};
</script>
</body>
</html>
